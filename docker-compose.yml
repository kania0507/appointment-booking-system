
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    volumes:
      - .:/var/www/html

    stdin_open: true
    tty: true
    container_name: appointment-booking-php

    working_dir: /var/www/html


  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
